name: jb_music
description: JB Music Premium AI-Powered Music Platform
version: 3.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  just_audio: ^0.10.4
  on_audio_query: ^2.9.0
  audio_service: ^0.18.13
  audio_session: ^0.2.1

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  palette_generator: ^0.3.3+3

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  rxdart: ^0.28.0

  permission_handler: ^12.0.3
  device_info_plus: ^11.5.0

  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5

  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.7

  get_it: ^7.7.0

  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/mock_tracks/demo_song.mp3
    - assets/mock_tracks/demo_song.lrc